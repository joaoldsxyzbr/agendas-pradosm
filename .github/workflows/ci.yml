name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-js-puro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: JavaScript, seguranca, build e navegador
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Dependencias reproduziveis
        run: npm ci --legacy-peer-deps
      - name: Auditoria de dependencias de producao
        run: npm audit --omit=dev
      - name: Bloquear vulnerabilidades altas e criticas nas dependencias de desenvolvimento
        run: |
          npm audit --audit-level=high
          npm audit --prefix apps/web --audit-level=high
      - name: Garantir isolamento da UI React e do Worker
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-modern-boundary.mjs
          node -e 'const p=require("./package.json");const d={...p.dependencies,...p.devDependencies};for(const n of ["react","react-dom","react-router-dom","vite","vitest","typescript"])if(d[n])process.exit(1)'
          node scripts/check-worker.mjs
      - name: Validar migrations e Worker
        run: npm run check:migrations
      - name: Testes JavaScript e bootstrap administrativo
        run: |
          npm test
          npm run test:bootstrap-admin
      - name: Build da UI React e integridade dos assets
        run: |
          npm run build
          node scripts/check-build.mjs
          node scripts/build-modern-preview.mjs
      - name: Dry-run do Worker da preview sem deploy
        run: npx wrangler deploy --dry-run --config wrangler.preview.jsonc
      - name: Dry-run do Worker de producao sem deploy
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Preparar Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E React isolado com dados sinteticos
        env:
          CI: "true"
        run: npx playwright test --config apps/web/playwright.config.mjs
      - name: Guardar diagnosticos em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosticos-js-puro
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  codeql:
    name: CodeQL JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analisar JS sem enviar para Code Scanning
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          upload: never
          output: codeql-results
      - name: Bloquear findings de seguranca
        shell: bash
        run: |
          shopt -s nullglob
          files=(codeql-results/*.sarif)
          test "${#files[@]}" -gt 0
          jq -r '[.[].runs[]?.results[]? | {rule: .ruleId, file: (.locations[0].physicalLocation.artifactLocation.uri // ""), line: (.locations[0].physicalLocation.region.startLine // 0), message: (.message.text // "")}]' --slurp "${files[@]}"
          jq -e '[.[].runs[]?.results[]?] | length == 0' --slurp "${files[@]}"

  local_windows:
    name: Preview local real (Windows / Node 26)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
      - name: Instalar dependencias
        run: npm.cmd ci --legacy-peer-deps
      - name: Build real no Windows
        run: npm.cmd run build
      - name: Validar modo Node SQLite (sem Workerd)
        run: node scripts/check-local-mock.mjs --node
      - name: Validar migrations, seed e login no D1 local
        run: node scripts/check-local-mock.mjs
      - name: Logs locais em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosticos-local-windows
          path: .tmp/local-mock*-smoke.log
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: verify
    if: always()
    needs: [quality, codeql, local_windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Exigir qualidade e seguranca verdes
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          LOCAL_WINDOWS_RESULT: ${{ needs.local_windows.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$CODEQL_RESULT" = "success"
          test "$LOCAL_WINDOWS_RESULT" = "success"

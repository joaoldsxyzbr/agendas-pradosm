name: Nexello - diagnostico temporario de leitura

on:
  push:
    branches: [feat/sincronizacao-manual-agendas-api]
    paths: ['.github/workflows/nexello-diagnostico.yml']

permissions: {}

jobs:
  diagnostico:
    if: github.repository == 'joaoldsxyzbr/agendas-pradosm' && github.ref == 'refs/heads/feat/sincronizacao-manual-agendas-api'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Consultar catalogo e estrutura sem expor dados
        env:
          NEXELLO_API_TOKEN: ${{ secrets.NEXELLO_API_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request
          import urllib.error
          import unicodedata

          BASE = "https://integracao-organiza.nexello.com.br/integracao/api/v2/relatorio-personalizado/"
          token = os.environ.get("NEXELLO_API_TOKEN", "").strip()
          if not token:
              sys.exit("Secret NEXELLO_API_TOKEN ausente ou indisponivel.")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def get(path):
              req = urllib.request.Request(BASE + path, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json",
              }, method="GET")
              try:
                  with opener.open(req, timeout=20) as response:
                      raw = response.read(1048577)
                      if len(raw) > 1048576:
                          sys.exit("Resposta excedeu o limite de diagnostico.")
                      return json.loads(raw)
              except urllib.error.HTTPError as error:
                  sys.exit("Consulta GET falhou: HTTP " + str(error.code))
              except Exception:
                  sys.exit("Falha de transporte ou resposta JSON invalida.")

          from datetime import datetime
          from zoneinfo import ZoneInfo
          from collections import Counter
          from time import sleep

          # Relatorio 60 somente, teto absoluto: 15 paginas e 1500 linhas.
          # Sem filtros nao documentados, sem exportar payload ou identificadores.
          limit = 100
          max_pages = 15
          today = datetime.now(ZoneInfo("America/Sao_Paulo")).date()
          seen = set()
          counts = Counter()
          daily = Counter()
          expected = None
          for number in range(1, max_pages + 1):
              if number > 1:
                  sleep(2.1)
              result = get("60?limit=100&page=" + str(number))
              if not isinstance(result, dict) or not isinstance(result.get("data"), list):
                  sys.exit("Formato inesperado.")
              total, last = result.get("total"), result.get("last_page")
              if type(total) is not int or total < 0 or type(last) is not int or last != max(1, (total + limit - 1) // limit):
                  sys.exit("Metadados invalidos.")
              if last > max_pages:
                  sys.exit("Relatorio excedeu teto preventivo de 1500 linhas.")
              if expected is None:
                  expected = (total, last)
              if expected != (total, last) or result.get("page") != number or result.get("per_page") != limit:
                  sys.exit("Paginacao mudou durante consulta.")
              rows = result["data"]
              if len(rows) != min(limit, max(0, total - (number - 1) * limit)):
                  sys.exit("Pagina incompleta.")
              for row in rows:
                  if not isinstance(row, dict):
                      sys.exit("Registro invalido.")
                  protocol = str(row.get("protocolo", ""))
                  if not re.fullmatch(r"\d{6,20}", protocol):
                      counts["protocolos_invalidos"] += 1
                  elif protocol in seen:
                      counts["protocolos_repetidos"] += 1
                  seen.add(protocol)
                  try:
                      date = datetime.strptime(row.get("data_agenda_inicio", ""), "%d/%m/%Y").date()
                      daily[date] += 1
                      counts["dias_anteriores" if date < today else "hoje" if date == today else "dias_futuros"] += 1
                  except (ValueError, TypeError):
                      counts["datas_invalidas"] += 1
                  store = row.get("filial_entrega")
                  counts["filiais_com_codigo" if isinstance(store, str) and re.fullmatch(r"F\d{1,3}\s*-\s*\S.*", store.strip(), re.I) else "filiais_sem_codigo_inequivoco"] += 1
                  counts["linhas"] += 1
              if number == last:
                  break
          print("Metadados:", json.dumps({"total": expected[0], "paginas": expected[1]}))
          print("Contagens agregadas:", json.dumps(dict(counts), ensure_ascii=True))
          print("Dias distintos:", len(daily))
          print("Maior quantidade em um dia:", max(daily.values(), default=0))
          print("Limite de leitura respeitado; nenhuma gravacao realizada.")
          PY

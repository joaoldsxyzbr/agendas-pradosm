name: Nexello - diagnostico temporario de leitura

on:
  push:
    branches: [feat/sincronizacao-manual-agendas-api]
    paths: ['.github/workflows/nexello-diagnostico.yml']

permissions: {}

jobs:
  diagnostico:
    if: github.repository == 'joaoldsxyzbr/agendas-pradosm' && github.ref == 'refs/heads/feat/sincronizacao-manual-agendas-api'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Consultar catalogo e estrutura sem expor dados
        env:
          NEXELLO_API_TOKEN: ${{ secrets.NEXELLO_API_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request
          import urllib.error
          import unicodedata

          BASE = "https://integracao-organiza.nexello.com.br/integracao/api/v2/relatorio-personalizado/"
          token = os.environ.get("NEXELLO_API_TOKEN", "").strip()
          if not token:
              sys.exit("Secret NEXELLO_API_TOKEN ausente ou indisponivel.")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def get(path):
              req = urllib.request.Request(BASE + path, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json",
              }, method="GET")
              try:
                  with opener.open(req, timeout=20) as response:
                      raw = response.read(1048577)
                      if len(raw) > 1048576:
                          sys.exit("Resposta excedeu o limite de diagnostico.")
                      return json.loads(raw)
              except urllib.error.HTTPError as error:
                  sys.exit("Consulta GET falhou: HTTP " + str(error.code))
              except Exception:
                  sys.exit("Falha de transporte ou resposta JSON invalida.")

          from collections import Counter
          from urllib.parse import urlencode
          from datetime import datetime

          def page(params):
              result = get("60?" + urlencode(params))
              if not isinstance(result, dict) or not isinstance(result.get("data"), list):
                  sys.exit("Formato inesperado.")
              if len(result["data"]) > 20:
                  sys.exit("Limite de amostra nao respeitado.")
              if not all(isinstance(row, dict) for row in result["data"]):
                  sys.exit("Registro invalido.")
              return result

          def shape(value):
              if not isinstance(value, str):
                  return type(value).__name__
              if not value.strip():
                  return "vazio"
              return re.sub(r"[A-Za-zÀ-ÿ]+", "L", re.sub(r"\d", "9", value))[:80]

          def date_of(value):
              if not isinstance(value, str):
                  return None
              for fmt, length in (("%Y-%m-%d", 10), ("%d/%m/%Y", 10), ("%d-%m-%Y", 10)):
                  try:
                      return datetime.strptime(value[:length], fmt).date().isoformat()
                  except ValueError:
                      pass
              return None

          result = page({"limit": 20, "page": 1})
          rows = result["data"]
          print("Amostra:", len(rows))
          fields = sorted({key for row in rows for key in row
                           if re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]{0,79}", key)})
          print("Campos:", json.dumps(fields))
          for key in ("data_agenda_inicio", "hora_agendada", "filial_entrega", "tipo", "nfe_numeros", "numero_pedido"):
              print("Formatos", key, json.dumps(dict(Counter(shape(row.get(key)) for row in rows)), ensure_ascii=True))
          types = {"nota fiscal", "pedido", "cnpj", "agenda fixa"}
          print("Tipos reconhecidos:", sum(isinstance(row.get("tipo"), str) and row["tipo"].strip().casefold() in types for row in rows))
          print("Protocolos unicos na amostra:", len({str(row.get("protocolo")) for row in rows}))
          print("Campos ausentes da importacao:", json.dumps([k for k in ("data_agenda_fim", "doca", "qtd_itens", "qtd_volumes", "paletes", "carga_batida") if k not in fields]))
          known = next((d for row in rows if (d := date_of(row.get("data_agenda_inicio")))), None)
          if not known:
              sys.exit("Formato de data nao reconhecido para sondagem.")
          # Hipoteses de filtro, nao documentadas. A data conhecida nao e registrada.
          for name in ("data", "data_agendada", "data_agenda_inicio"):
              empty = page({"limit": 2, "page": 1, name: "1900-01-01"})
              matched = page({"limit": 2, "page": 1, name: known})
              print("Sondagem", name, json.dumps({
                  "total_data_inexistente": empty.get("total") if type(empty.get("total")) is int else None,
                  "linhas_data_inexistente": len(empty["data"]),
                  "total_data_conhecida": matched.get("total") if type(matched.get("total")) is int else None,
                  "linhas_data_conhecida": len(matched["data"]),
                  "linhas_coincidentes": sum(date_of(row.get("data_agenda_inicio")) == known for row in matched["data"])
              }))
          PY
